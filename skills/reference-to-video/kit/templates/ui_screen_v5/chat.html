<html><head><meta charset="utf-8"><style>

@font-face{font-family:Inter;font-weight:400;src:url('../../../fonts/Inter-400.woff2')}
@font-face{font-family:Inter;font-weight:700;src:url('../../../fonts/Inter-700.woff2')}
@font-face{font-family:Serif;font-style:italic;src:url('../../../fonts/InstrumentSerif-400-italic.woff2')}
@font-face{font-family:Serif;font-style:normal;src:url('../../../fonts/InstrumentSerif-400.woff2')}
@font-face{font-family:Mono;src:url('../../../fonts/JetBrainsMono-400.woff2')}
@font-face{font-family:Grot;font-weight:700;src:url('../../../fonts/SpaceGrotesk-700.woff2')}
*{box-sizing:border-box;margin:0;padding:0} body{background:transparent;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}

html,body{width:414px;height:868px;overflow:hidden;background:transparent}
#phone{position:absolute;left:0;top:0;width:414px;height:868px;border-radius:66px;
 background:linear-gradient(135deg,#9a958d 0%,#6e6a64 18%,#3b3936 50%,#6e6a64 82%,#a29d95 100%);}
#bez{position:absolute;left:3px;top:3px;right:3px;bottom:3px;border-radius:63px;background:#0b0b0c}
.btn{position:absolute;background:#5a5752;border-radius:2px}
#scr{position:absolute;left:12px;top:12px;width:390px;height:844px;border-radius:54px;overflow:hidden;background:#fff}
#island{position:absolute;left:142px;top:23px;width:130px;height:37px;border-radius:20px;background:#000;z-index:50}
#status{position:absolute;left:0;top:0;width:390px;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 32px 0 46px;font-weight:700;font-size:16.5px;color:#000;z-index:5}
#hdr{position:absolute;left:0;top:54px;width:390px;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:5;background:#fff}
#hdr .t{font-weight:700;font-size:18px;color:#0d0d0d;display:flex;align-items:center;gap:5px}
#chat{position:absolute;left:0;top:106px;width:390px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 10px;overflow:hidden}
.u{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-top:14px;max-width:300px}
.ub{background:#F3F3F3;border-radius:22px;padding:11px 16px;font-size:16.5px;line-height:23px;color:#0d0d0d}
.uimg{width:150px;height:150px;border-radius:18px;background-size:cover}
.a{align-self:flex-start;margin-top:18px;width:100%}
.alab{font-size:15px;color:#8f8f8f;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.aimg{width:330px;height:330px;border-radius:20px;background-size:cover;position:relative;overflow:hidden}
.acts{display:flex;gap:18px;margin-top:12px;padding-left:4px}
.gen{width:330px;height:330px;border-radius:20px;background:#EFEFEF;position:relative;overflow:hidden}
#comp{position:absolute;left:12px;right:12px;border-radius:28px;background:#fff;border:1px solid #E3E3E3;box-shadow:0 2px 14px rgba(0,0,0,.06);padding:10px 10px 10px 10px;z-index:6}
.row{display:flex;align-items:flex-end;gap:8px}
.cin{flex:1;font-size:16.5px;line-height:23px;color:#0d0d0d;padding:6px 2px 6px 4px;min-height:35px;word-wrap:break-word}
.ph{color:#9b9b9b}
.ib{width:35px;height:35px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.caret{display:inline-block;width:2px;height:21px;background:#0d0d0d;vertical-align:-4px;margin-left:1px}
#kb{position:absolute;left:0;width:390px;height:336px;background:#D3D5DB;z-index:7}
.sug{height:44px;display:flex;align-items:center;justify-content:space-around;font-size:16px;color:#1c1c1e}
.sug span{flex:1;text-align:center}.sug i{width:1px;height:24px;background:#B4B6BC}
.kr{display:flex;justify-content:center;gap:6px;margin-top:11px;padding:0 3px}
.k{width:33px;height:43px;border-radius:5px;background:#fff;box-shadow:0 1px 0 #898A8D;display:flex;align-items:center;justify-content:center;font-size:22px;color:#000}
.kd{background:#ABB0BA}
#pop{position:absolute;width:54px;height:100px;z-index:9}
#home{position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:#0d0d0d;z-index:10}
#dim{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:11}
#sheet{position:absolute;left:0;width:390px;height:372px;border-radius:26px 26px 0 0;background:#fff;z-index:12;padding:10px 18px 0}
.grab{width:38px;height:5px;border-radius:3px;background:#D5D5D5;margin:0 auto 14px}
.th{width:80px;height:80px;border-radius:14px;background-size:cover;flex:none;position:relative}
.li{display:flex;align-items:center;gap:16px;height:54px;font-size:17px;color:#0d0d0d;border-bottom:1px solid #F0F0F0}
.chip{position:relative;width:64px;height:64px;border-radius:14px;background-size:cover;margin:2px 0 6px 4px}
</style></head><body>
<div id="phone"><div class="btn" style="left:-3px;top:170px;width:4px;height:32px"></div><div class="btn" style="left:-3px;top:228px;width:4px;height:58px"></div><div class="btn" style="left:-3px;top:298px;width:4px;height:58px"></div><div class="btn" style="right:-3px;top:250px;width:4px;height:92px"></div>
<div id="bez"></div><div id="scr"></div><div id="island"></div></div>
<script>
const IC={
 menu:'<svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 8h16M4 15h10" stroke="#0d0d0d" stroke-width="2.2" stroke-linecap="round"/></svg>',
 edit:'<svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 4H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-5" stroke="#0d0d0d" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M17.5 3.5l3 3L12 15l-4 1 1-4z" stroke="#0d0d0d" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>',
 chev:'<svg width="10" height="14" viewBox="0 0 10 14"><path d="M3 2l5 5-5 5" stroke="#9b9b9b" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
 plus:'<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 3v14M3 10h14" stroke="#0d0d0d" stroke-width="2" stroke-linecap="round"/></svg>',
 mic:'<svg width="20" height="20" viewBox="0 0 20 20"><rect x="7" y="2" width="6" height="11" rx="3" stroke="#0d0d0d" stroke-width="1.8" fill="none"/><path d="M4 9a6 6 0 0 0 12 0M10 15v3" stroke="#0d0d0d" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
 wave:'<svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 7v4M7 4v10M11 6v6M15 8v2" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
 up:'<svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 15V3M4 8l5-5 5 5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 cam:'<svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" stroke="#0d0d0d" stroke-width="1.8" fill="none" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" stroke="#0d0d0d" stroke-width="1.8" fill="none"/></svg>',
 img:'<svg width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" stroke="#0d0d0d" stroke-width="1.8" fill="none"/><circle cx="9" cy="10" r="2" fill="#0d0d0d"/><path d="M4 18l5-5 4 4 3-3 4 4" stroke="#0d0d0d" stroke-width="1.8" fill="none"/></svg>',
 file:'<svg width="24" height="24" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" stroke="#0d0d0d" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M14 3v5h5" stroke="#0d0d0d" stroke-width="1.8" fill="none"/></svg>',
 copy:'<svg width="18" height="18" viewBox="0 0 18 18"><rect x="6" y="6" width="9" height="9" rx="2" stroke="#8f8f8f" stroke-width="1.6" fill="none"/><path d="M12 4V3.5A1.5 1.5 0 0 0 10.5 2h-7A1.5 1.5 0 0 0 2 3.5v7A1.5 1.5 0 0 0 3.5 12H4" stroke="#8f8f8f" stroke-width="1.6" fill="none"/></svg>',
 thumb:'<svg width="18" height="18" viewBox="0 0 18 18"><path d="M5 8l3-6c1.2 0 2 .8 2 2v3h4.2a1.5 1.5 0 0 1 1.5 1.8l-1.1 5.5A2 2 0 0 1 12.7 16H5zM2 8h3v8H2z" stroke="#8f8f8f" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>',
 share:'<svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 2v10M5 6l4-4 4 4M3 10v5h12v-5" stroke="#8f8f8f" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 x:'<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
 sig:'<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>',
 wifi:'<svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 11.5l2.3-2.6a3.3 3.3 0 0 0-4.6 0zM3.4 6.2a7.3 7.3 0 0 1 10.2 0l1.6-1.8a9.8 9.8 0 0 0-13.4 0zM0 2.6l1.5 1.8a10.8 10.8 0 0 1 14 0L17 2.6a13.3 13.3 0 0 0-17 0z"/></svg>',
 bat:'<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2"/><path d="M24 4.5v4c.8-.3 1.5-1 1.5-2s-.7-1.7-1.5-2z" opacity=".4"/></svg>'
};
const PH={ref:'p_ref.png',wrong:'p_wrong.png',fixed:'p_fixed.png',d1:'p_d1.png',d2:'p_d2.png',d3:'p_d3.png'};
const KR=['qwertyuiop','asdfghjkl','zxcvbnm'];
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function kb(press){ let h='<div class="sug"><span>"'+(press.sug||'hai')+'"</span><i></i><span>'+(press.s2||'aur')+'</span><i></i><span>'+(press.s3||'mein')+'</span></div>';
 h+='<div class="kr">'+[...KR[0]].map(c=>'<div class="k" data-key="'+c+'">'+c+'</div>').join('')+'</div>';
 h+='<div class="kr" style="padding:0 20px">'+[...KR[1]].map(c=>'<div class="k" data-key="'+c+'">'+c+'</div>').join('')+'</div>';
 h+='<div class="kr" style="justify-content:space-between;padding:0 3px"><div class="k kd" style="width:43px"><svg width="20" height="18" viewBox="0 0 20 18"><path d="M10 2L2 10h4v6h8v-6h4z" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg></div><div style="display:flex;gap:6px">'+[...KR[2]].map(c=>'<div class="k" data-key="'+c+'">'+c+'</div>').join('')+'</div><div class="k kd" style="width:43px"><svg width="24" height="18" viewBox="0 0 24 18"><path d="M7 2h14v14H7l-6-7z" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 6l6 6M17 6l-6 6" stroke="#000" stroke-width="1.6" stroke-linecap="round"/></svg></div></div>';
 h+='<div class="kr" style="justify-content:space-between;padding:0 3px"><div class="k kd" style="width:43px;font-size:16px">123</div><div class="k kd" style="width:43px;font-size:20px">☺</div><div class="k" data-key=" " style="flex:1;font-size:16px">space</div><div class="k kd" style="width:92px;font-size:16px">return</div></div>';
 return h; }
function render(s){
 const scr=document.getElementById('scr'); const kbH=336, kbY=844-kbH*s.kb;
 let h='<div id="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">'+IC.sig+IC.wifi+IC.bat+'</span></div>';
 h+='<div id="hdr"><span data-k="menu">'+IC.menu+'</span><span class="t">ChatGPT '+IC.chev+'</span><span>'+IC.edit+'</span></div>';
 // composer
 let chip='';
 if(s.chip){ const p=s.chip.p; chip='<div class="chip" data-k="chip" style="background-image:url('+PH[s.chip.img]+')">'+
   (p<1?'<div style="position:absolute;inset:0;border-radius:14px;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" stroke="rgba(255,255,255,.35)" stroke-width="3" fill="none"/><circle cx="15" cy="15" r="12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="'+(75.4*p)+' 80" transform="rotate(-90 15 15)"/></svg></div>':'')+
   '<div style="position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:#0d0d0d;display:flex;align-items:center;justify-content:center;border:2px solid #fff">'+IC.x+'</div></div>'; }
 const txt=s.typed||''; const has=txt.length>0||s.chip;
 const cin=txt.length?'<div class="cin" data-k="cin">'+esc(txt)+(s.caret?'<span class="caret"></span>':'')+'</div>':'<div class="cin ph" data-k="cin">'+(s.caret?'<span class="caret" style="margin:0 2px 0 0"></span>':'')+'Ask anything</div>';
 const right=has&&txt.length?'<div class="ib" data-k="send" style="background:#0d0d0d">'+IC.up+'</div>':'<div class="ib">'+IC.mic+'</div><div class="ib" data-k="send" style="background:#0d0d0d">'+IC.wave+'</div>';
 const compBottom = s.kb>0 ? (844-kbY)+8 : 30;
 h+='<div id="comp" style="bottom:'+compBottom+'px">'+chip+'<div class="row"><div class="ib" data-k="plus" style="border:1px solid #E3E3E3">'+IC.plus+'</div>'+cin+right+'</div></div>';
 // chat
 let c='';
 for(const m of (s.msgs||[])){
  if(m.r=='u'){ c+='<div class="u">'+(m.img?'<div class="uimg" style="background-image:url('+PH[m.img]+')"></div>':'')+(m.t?'<div class="ub">'+esc(m.t)+'</div>':'')+'</div>'; }
  else if(m.r=='img'){ c+='<div class="a"><div class="alab">Image created</div><div class="aimg" data-k="'+(m.k||'aimg')+'" style="background-image:url('+PH[m.img]+');'+(m.blur?'filter:blur('+m.blur+'px)':'')+'"></div><div class="acts">'+IC.copy+IC.thumb+IC.share+'</div></div>'; }
  else if(m.r=='gen'){ c+='<div class="a"><div class="alab">Creating image</div><div class="gen"><div style="position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 70%);transform:translateX('+(-330+660*m.p)+'px)"></div></div></div>'; }
 }
 const compH = 60 + (s.chip?72:0) + Math.max(0,(s.lines||1)-1)*23;
 const chatBottom = compBottom + compH + 6;
 h+='<div id="chat" style="height:'+(844-106-chatBottom)+'px;padding-bottom:'+(s.pad||10)+'px">'+c+'</div>';
 if(s.greet) h+='<div style="position:absolute;left:0;top:'+(360-40*(s.kb||0))+'px;width:390px;text-align:center;font-weight:700;font-size:25px;color:#0d0d0d;letter-spacing:-.3px">'+s.greet+'</div>';
 if(s.kb>0){ h+='<div id="kb" style="top:'+kbY+'px">'+kb(s.press||{})+'</div>'; }
 if(s.sheet>0){ const y=844-372*s.sheet; h+='<div id="dim" style="opacity:'+s.sheet+'"></div><div id="sheet" style="top:'+y+'px"><div class="grab"></div>'+
   '<div style="font-weight:700;font-size:17px;margin-bottom:12px">Recent photos</div><div style="display:flex;gap:9px">'+
   ['ref','d1','d2','d3'].map(k=>'<div class="th" data-k="th_'+k+'" style="background-image:url('+PH[k]+')">'+(s.pick&&k=='ref'?'<div style="position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:#0d0d0d;border:2px solid #fff;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.5L5 9l5-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>':'')+'</div>').join('')+'</div>'+
   '<div style="margin-top:14px"><div class="li">'+IC.cam+'Camera</div><div class="li">'+IC.img+'Photos</div><div class="li" style="border:none">'+IC.file+'Files</div></div></div>'; }
 h+='<div id="home" style="background:'+(s.sheet>0.5?'#0d0d0d':'#0d0d0d')+'"></div>';
 scr.innerHTML=h;
 { const cp=scr.querySelector('#comp').getBoundingClientRect(), sr=scr.getBoundingClientRect(); const ch=scr.querySelector('#chat'); ch.style.height=(cp.top-sr.top-106-6)+'px'; }
 if(s.press&&s.press.k){ const el=[...scr.querySelectorAll('.k')].find(e=>e.dataset.key==s.press.k); if(el){ const r=el.getBoundingClientRect(), sr=scr.getBoundingClientRect();
   if(s.press.k==' '){ el.style.background='#ABB0BA'; } else {
   const p=document.createElement('div'); p.id='pop'; p.style.left=(r.left-sr.left+r.width/2-27)+'px'; p.style.top=(r.top-sr.top-56)+'px';
   p.innerHTML='<svg width="54" height="100" viewBox="0 0 54 100"><path d="M8 0h38a8 8 0 0 1 8 8v40c0 6-6 10-10 14l-1 30a8 8 0 0 1-8 8H17a8 8 0 0 1-8-8l-1-30C4 58 0 54 0 48V8a8 8 0 0 1 8-8z" fill="#fff" style="filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))"/><text x="27" y="40" font-family="Inter" font-size="32" text-anchor="middle" fill="#000">'+s.press.k+'</text></svg>';
   scr.appendChild(p);} } }
 // rects (phone px, x3 later)
 const out={}; scr.querySelectorAll('[data-k]').forEach(e=>{const r=e.getBoundingClientRect(); out[e.dataset.k]=[r.left,r.top,r.width,r.height];}); return out;
}
</script></body></html>
